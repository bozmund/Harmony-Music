name: PR checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  flutter-checks:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          # The SDK is a ~1.5 GB download that was being re-fetched on every
          # run of every workflow.
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install packages
        run: flutter pub get

      - name: Create .env
        # pubspec.yaml declares .env as an asset, so analyze/test fail if it
        # doesn't exist. It's git-ignored (a per-developer/CI build asset, not
        # source), so a checkout no longer provides one. Placeholder values are
        # fine here: analyze and test never need real Auth0 credentials.
        run: cp .env.example .env

      - name: Analyze
        run: flutter analyze

      - name: Check for unused files and code
        # Blocking: the codebase is clean as of 6.0.0, so any finding is new
        # dead code introduced by the PR. Generated bindings are excluded.
        #
        # `*_native.dart` is excluded from the *code* check only. Those files
        # are the native half of a `export 'x_stub.dart' if (dart.library.io)
        # 'x_native.dart'` triad, and the linter resolves the default branch —
        # so it sees the stub's class as used and reports the identically named
        # native one as dead, on every platform-split service. They stay in the
        # unused-*files* check, which follows the export and finds them fine.
        # The cost is that genuinely dead code inside a native half goes
        # unreported; they are thin platform shims, which makes that acceptable.
        run: |
          dart run dart_code_linter:metrics check-unused-files lib --exclude "lib/native_bindings/**"
          dart run dart_code_linter:metrics check-unused-code lib --exclude "{lib/native_bindings/**,lib/**/*_native.dart}"

      - name: Test
        run: flutter test
